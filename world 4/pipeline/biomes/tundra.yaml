# Treeless arctic tundra biome — prompt set for diversity batch.
#
# 16 ground (frozen ground, permafrost polygons, lichen mats, cotton
# grass) / 21 mid (low arctic shrubs, dwarf willow, berries, sedge
# meadows) / 14 rock (frost-shattered exposed bedrock, glacial erratics).
#
# Palette: muted greens + warm browns + rust-orange autumn tones + grey
# rock. Distinct from alpine (no snow as dominant) and forest (no trees).
# Low-lying ground-hugging vegetation. Arctic floor at low elevation.

biome: tundra
prompt_prefix: "tileable seamless texture, "
prompt_suffix: ", overhead perspective"

slots:
  ground:
    category: Mixed
    candidates:
      - tag: tussock_grass
        body: "arctic tundra tussock grass mounds, muted yellow-brown grass tufts on dark wet ground, varied vertical texture"
      - tag: cotton_grass_meadow
        body: "cotton grass meadow with white fluffy seedheads over dark damp tundra, vivid white over muted brown-green"
      - tag: lichen_mat_dense
        body: "dense reindeer lichen mat carpet, pale grey-green fungal mass with intricate branching texture"
      - tag: permafrost_polygon
        body: "permafrost polygon ground with frost-heave cracks forming geometric patterns, muted earth tones"
      - tag: arctic_moss_carpet
        body: "arctic moss carpet with varied tones from rust-red to dark green, soft organic ground coverage"
      - tag: dwarf_birch_floor
        body: "dwarf arctic birch ground cover with small dark leaves over wet brown soil, low ground-hugging vegetation"
      - tag: rust_autumn_tundra
        body: "autumn tundra ground with rust-orange and red ground cover plants, vivid warm palette on dark base"
      - tag: arctic_heath
        body: "arctic heath ground with mixed crowberry and other dwarf shrubs, muted greens and dark woody stems"
      - tag: sphagnum_with_cranberry
        body: "sphagnum moss carpet with scattered red cranberries, dark green moss with vivid red accents"
      - tag: frost_heave_stones
        body: "frost-heaved tundra ground with stones sorted into surface patterns, mixed rock and brown soil"
      - tag: arctic_wet_meadow
        body: "wet arctic meadow with mixed sedges, mosses, and small pools, muted green-brown varied surface"
      - tag: lichen_yellow_orange
        body: "tundra ground with vivid yellow-orange lichen patches on dark damp soil, vivid color over muted base"
      - tag: dryas_mat
        body: "mountain avens (dryas) mat with small white flowers and dark glossy leaves, low cushion vegetation"
      - tag: post_thaw_mud
        body: "post-thaw tundra mud with embedded plant fragments and small stones, dark wet brown varied surface"
      - tag: arctic_grass_tundra
        body: "arctic grass tundra with mixed sedges and small flowers, muted yellow-green low ground coverage"
      - tag: peat_with_lichen
        body: "wet peaty tundra ground with patches of pale grey-green lichen, dark organic base with muted accents"

