<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shader Cauldron v6</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Cinzel:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#06060b;--s1:#0d0d16;--s2:#14141f;--s3:#1c1c2a;--s4:#242436;--brd:#2a2a3c;--acc:#ff6b35;--acc2:#8b5cf6;--acc3:#06d6a0;--acc4:#38bdf8;--acc5:#f472b6;--txt:#e8e6e3;--dim:#6b6b7b;--mid:#9999aa;--codebg:#090910;--err:#f44336;--warn:#ff9800;}
html{scrollbar-width:thin;scrollbar-color:var(--brd) transparent;}
body{background:var(--bg);color:var(--txt);font-family:'JetBrains Mono',monospace;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}

/* Header */
header{padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--brd);background:linear-gradient(180deg,rgba(139,92,246,.04) 0%,transparent 100%);position:relative;z-index:10;}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-icon{width:28px;height:28px;background:conic-gradient(from 45deg,var(--acc),var(--acc2),var(--acc5),var(--acc4),var(--acc3),var(--acc));border-radius:5px;animation:lspin 6s linear infinite;}
@keyframes lspin{to{filter:hue-rotate(360deg);}}
.logo h1{font-family:'Cinzel',serif;font-size:17px;font-weight:700;letter-spacing:1px;}.logo h1 span{color:var(--acc2);}
.logo .ver{font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-left:-4px;}
.hdr-ctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;justify-content:center;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* Buttons */
.btn{padding:6px 12px;font-size:10px;font-family:inherit;font-weight:500;border-radius:5px;cursor:pointer;border:1px solid var(--brd);background:var(--s2);color:var(--txt);transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.btn:hover{border-color:var(--dim);background:var(--s3);}.btn:active{transform:scale(.96);}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#fff;font-size:11px;padding:6px 14px;}.btn-pri:hover{background:#ff8555;box-shadow:0 2px 12px rgba(255,107,53,.3);}
.btn-a2{background:var(--acc2);border-color:var(--acc2);color:#fff;}.btn-a2:hover{background:#9d73f7;}
.btn-a3{background:var(--acc3);border-color:var(--acc3);color:#081a14;}
.btn-sm{padding:4px 8px;font-size:9px;}.btn-icon{padding:5px 7px;font-size:13px;line-height:1;}
.btn-warn{background:var(--warn);border-color:var(--warn);color:#000;}
.btn-grn{background:var(--acc3);border-color:var(--acc3);color:#081a14;}.btn-grn:hover{background:#1ae8b2;}
.btn-active{background:var(--acc4)!important;border-color:var(--acc4)!important;color:#000!important;}

/* Controls row */
.ctrl-row{padding:8px 16px;border-bottom:1px solid var(--brd);background:var(--s1);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ctrl-grp{display:flex;align-items:center;gap:4px;}
.ctrl-lbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
select{padding:4px 6px;font-size:10px;font-family:inherit;background:var(--s2);color:var(--txt);border:1px solid var(--brd);border-radius:3px;cursor:pointer;}
.spacer{flex:1;}.seed-d{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums;}.fps{font-size:9px;color:var(--acc3);font-variant-numeric:tabular-nums;}
.time-ctrl{display:flex;align-items:center;gap:4px;padding:2px 6px;background:var(--s3);border-radius:4px;border:1px solid var(--brd);}
.time-ctrl input[type=range]{width:60px;}.time-lbl{font-size:9px;color:var(--mid);min-width:28px;text-align:center;}

/* Canvas */
.canvas-wrap{position:relative;width:100%;height:48vh;min-height:280px;background:#000;border-bottom:1px solid var(--brd);}
.canvas-wrap.transparent-bg{background:repeating-conic-gradient(#222 0% 25%,#333 0% 50%) 0 0/20px 20px;}
.canvas-wrap.fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:1000;min-height:unset;}
canvas{width:100%;height:100%;display:block;cursor:crosshair;}
.err-ovl{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(6,6,11,.95);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s;}
.err-ovl.vis{opacity:1;pointer-events:auto;}
.err-box{background:var(--s1);border:1px solid var(--err);border-radius:6px;padding:12px;max-width:500px;font-size:10px;color:#f66;line-height:1.5;max-height:80vh;overflow-y:auto;}.err-box strong{color:var(--err);display:block;margin-bottom:3px;}
.mouse-pos{position:absolute;bottom:8px;right:8px;font-size:9px;color:rgba(255,255,255,.3);pointer-events:none;}
.fs-exit{position:absolute;top:12px;right:12px;z-index:1001;}

/* History */
.history-strip{border-bottom:1px solid var(--brd);background:var(--s1);overflow:hidden;}
.hist-header{padding:6px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(42,42,60,.5);}
.hist-title{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.hist-scroll{display:flex;gap:4px;padding:6px 16px;overflow-x:auto;align-items:center;}
.hist-thumb{width:64px;height:48px;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:all .15s;position:relative;overflow:hidden;background:#000;}
.hist-thumb:hover{border-color:var(--acc2);transform:scale(1.05);}.hist-thumb.active{border-color:var(--acc);}
.hist-thumb canvas{width:100%;height:100%;}.hist-thumb .ht-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:7px;color:var(--dim);padding:1px 3px;text-align:center;white-space:nowrap;overflow:hidden;}
.fav-star{position:absolute;top:2px;right:2px;font-size:10px;cursor:pointer;opacity:.5;transition:opacity .15s;z-index:2;}.fav-star:hover,.fav-star.saved{opacity:1;}

/* Sliders */
.sliders-panel{border-bottom:1px solid var(--brd);background:var(--s1);max-height:220px;overflow-y:auto;}
.sl-header{padding:6px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(42,42,60,.5);background:var(--s2);position:sticky;top:0;z-index:2;}
.sl-title{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;}
.sl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0;}
.sl-item{padding:5px 16px;border-bottom:1px solid rgba(42,42,60,.3);border-right:1px solid rgba(42,42,60,.3);display:flex;align-items:center;gap:8px;}
.sl-item:hover{background:rgba(255,255,255,.012);}
.sl-label{font-size:9px;color:var(--mid);min-width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sl-tag{font-size:7px;color:var(--acc2);opacity:.6;margin-right:3px;}
input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:var(--brd);border-radius:1px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid var(--bg);transition:transform .1s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3);}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid var(--bg);}
.sl-val{font-size:9px;color:var(--acc3);min-width:32px;text-align:right;font-variant-numeric:tabular-nums;}
.sl-empty{padding:14px;text-align:center;font-size:10px;color:var(--dim);}

/* Code section */
.code-sec{background:var(--codebg);}
.code-hdr{padding:6px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd);background:var(--s1);gap:6px;}
.code-hdr-left{display:flex;align-items:center;gap:6px;}
.code-hdr-right{display:flex;align-items:center;gap:4px;}
.tabs{display:flex;gap:2px;}
.tab{padding:3px 8px;font-size:9px;border-radius:3px;cursor:pointer;background:transparent;color:var(--dim);border:1px solid transparent;font-family:inherit;transition:all .15s;}
.tab.active{background:var(--s3);color:var(--txt);border-color:var(--brd);}.tab:hover:not(.active){color:var(--txt);}
.code-scroll{max-height:32vh;overflow:auto;padding:0;}
.code-ct{font-size:10.5px;line-height:1.55;white-space:pre;tab-size:2;font-family:'JetBrains Mono',monospace;padding:10px 16px;}
.kw{color:#c678dd;}.fn{color:#61afef;}.num{color:#d19a66;}.cmt{color:#5c6370;font-style:italic;}.bi{color:#56b6c2;}.st{color:#98c379;}

/* Edit mode */
.code-edit{display:none;width:100%;min-height:300px;max-height:50vh;background:var(--codebg);color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.55;tab-size:2;border:none;outline:none;resize:vertical;padding:10px 16px;white-space:pre;overflow:auto;}
.code-edit.active{display:block;}
.code-edit:focus{box-shadow:inset 0 0 0 1px var(--acc2);}
.edit-indicator{font-size:8px;padding:2px 6px;border-radius:3px;background:var(--warn);color:#000;font-weight:700;display:none;}
.edit-indicator.vis{display:inline-block;}
.compile-err{padding:8px 16px;font-size:10px;color:var(--err);background:rgba(244,67,54,.08);border-top:1px solid rgba(244,67,54,.2);display:none;white-space:pre-wrap;max-height:100px;overflow-y:auto;}
.compile-err.vis{display:block;}

/* Favs panel */
.fav-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(6,6,11,.95);z-index:900;overflow-y:auto;padding:40px 20px;}
.fav-panel.vis{display:block;}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1200px;margin:0 auto;}
.fav-card{background:var(--s2);border:1px solid var(--brd);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .15s;}
.fav-card:hover{border-color:var(--acc2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.fav-card canvas{width:100%;height:140px;display:block;}
.fav-meta{padding:8px 10px;}.fav-meta .fm-style{font-size:9px;color:var(--acc2);}.fav-meta .fm-seed{font-size:8px;color:var(--dim);margin-top:2px;}
.fav-close{position:fixed;top:16px;right:20px;z-index:901;}
.fav-title-bar{max-width:1200px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;}
.fav-title{font-family:'Cinzel',serif;font-size:20px;color:var(--acc2);}
.fav-empty{text-align:center;padding:60px 20px;color:var(--dim);font-size:12px;}

/* Toast */
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--acc3);color:#081a14;padding:6px 16px;border-radius:4px;font-size:10px;font-weight:500;z-index:1100;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}.toast.vis{transform:translateX(-50%) translateY(0);}
.shortcuts{position:fixed;bottom:8px;right:12px;font-size:8px;color:var(--dim);opacity:.5;z-index:5;}.shortcuts span{background:var(--s3);padding:1px 4px;border-radius:2px;margin:0 1px;border:1px solid var(--brd);}

/* Screenshot resolution modal */
.ss-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:20px;z-index:1200;min-width:240px;}
.ss-modal.vis{display:block;}
.ss-modal h3{font-family:'Cinzel',serif;font-size:14px;margin-bottom:12px;color:var(--acc2);}
.ss-modal .ss-opts{display:flex;flex-direction:column;gap:6px;}
.ss-modal .ss-opt{padding:8px 12px;background:var(--s3);border:1px solid var(--brd);border-radius:4px;cursor:pointer;font-size:10px;font-family:inherit;color:var(--txt);text-align:left;transition:all .15s;}
.ss-modal .ss-opt:hover{border-color:var(--acc);background:var(--s4);}
.ss-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1199;}
.ss-backdrop.vis{display:block;}

/* Auto mode panel */
.auto-panel{display:none;position:fixed;top:50px;right:16px;background:var(--s2);border:1px solid var(--brd);border-radius:8px;padding:14px 16px;z-index:100;min-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.6);}
.auto-panel.vis{display:block;}
.auto-panel h3{font-family:'Cinzel',serif;font-size:13px;color:var(--acc4);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.auto-panel h3 .auto-status{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:3px;background:var(--s3);color:var(--dim);}
.auto-panel h3 .auto-status.running{background:var(--acc3);color:#081a14;}
.auto-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.auto-row label{font-size:9px;color:var(--mid);min-width:90px;flex-shrink:0;}
.auto-row input[type=range]{flex:1;}
.auto-row .auto-val{font-size:9px;color:var(--acc3);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;}
.auto-row select{flex:1;}
.auto-checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.auto-check{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--mid);cursor:pointer;}
.auto-check input{accent-color:var(--acc4);cursor:pointer;}
.auto-btns{display:flex;gap:6px;margin-top:12px;}
.auto-progress{height:2px;background:var(--s3);border-radius:1px;margin-top:8px;overflow:hidden;}
.auto-progress-bar{height:100%;background:var(--acc4);transition:width .1s linear;width:0%;}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon"></div><h1>Shader <span>Cauldron</span></h1><span class="ver">v6</span></div>
  <div class="hdr-ctrls">
    <button class="btn btn-pri" id="randomBtn">🎲 Randomize</button>
    <button class="btn btn-a2" id="tweakBtn">✦ Mutate</button>
    <button class="btn btn-a3 btn-sm" id="resetBtn">↺ Reset</button>
    <button class="btn btn-sm" id="fixSeamBtn" title="Fix atan seam lines">🔧 Fix Seam</button>
    <button class="btn btn-sm" id="copyBtn">📋 Copy</button>
    <button class="btn btn-sm" id="ssBtn" title="Screenshot">📷 Save</button>
    <button class="btn btn-sm" id="bgBtn" title="Remove background (preview transparency)">🔲 No BG</button>
    <button class="btn btn-sm" id="autoBtn" title="Auto-cycle shaders">🔄 Auto</button>
    <button class="btn btn-sm" id="shareBtn" title="Copy shareable URL">🔗 Share</button>
    <button class="btn btn-sm" id="favBtn">⭐ Favs</button>
    <button class="btn btn-sm btn-icon" id="fsBtn" title="Fullscreen">⛶</button>
  </div>
  <div class="hdr-right">
    <div class="time-ctrl">
      <button class="btn btn-sm btn-icon" id="pauseBtn" title="Pause">▶</button>
      <span class="time-lbl" id="spdLabel">1x</span>
      <input type="range" id="spdSlider" min="0" max="4" step="0.1" value="1">
    </div>
    <div class="fps" id="fps">--</div>
  </div>
</header>
<div class="ctrl-row">
  <div class="ctrl-grp"><span class="ctrl-lbl">Complexity</span>
    <select id="complexity"><option value="simple">Simple</option><option value="medium" selected>Medium</option><option value="complex">Complex</option><option value="chaos">Chaos</option><option value="insane">Insane</option></select>
  </div>
  <div class="ctrl-grp"><span class="ctrl-lbl">Style</span>
    <select id="style">
      <optgroup label="General"><option value="any">Any</option><option value="organic">Organic</option><option value="geometric">Geometric</option><option value="psychedelic">Psychedelic</option><option value="glitch">Glitch</option><option value="cosmic">Cosmic</option><option value="neon">Neon</option><option value="dark">Dark</option></optgroup>
      <optgroup label="🧙 Wizard Spells"><option value="arcane">⚗ Arcane</option><option value="fire_spell">🔥 Fire</option><option value="frost">❄ Frost</option><option value="lightning">⚡ Lightning</option><option value="void_magic">🌑 Void</option><option value="holy">✨ Holy</option><option value="poison">☠ Poison</option><option value="portal">🌀 Portal</option><option value="shield">🛡 Shield</option><option value="enchant">💎 Enchant</option><option value="nature">🌿 Nature</option><option value="blood">🩸 Blood</option><option value="necro">💀 Necro</option><option value="chrono">⏳ Chrono</option></optgroup>
    </select>
  </div>
  <div class="ctrl-grp"><span class="ctrl-lbl">Output</span>
    <select id="shaderType"><option value="2d" selected>2D (canvas_item)</option><option value="3d">3D (spatial)</option></select>
  </div>
  <span class="spacer"></span>
  <span class="seed-d" id="seedD">Seed: --</span>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="glc"></canvas>
  <div class="err-ovl" id="errOvl"><div class="err-box"><strong>⚠ Shader Error</strong><span id="errTxt"></span></div></div>
  <div class="mouse-pos" id="mousePos">Mouse: 0, 0</div>
  <button class="btn btn-sm fs-exit" id="fsExit" style="display:none">✕ Exit</button>
</div>
<div class="history-strip" id="histStrip">
  <div class="hist-header"><span class="hist-title">History</span><span class="hist-title" id="histCount">0</span></div>
  <div class="hist-scroll" id="histScroll"></div>
</div>
<div class="sliders-panel" id="slPanel">
  <div class="sl-header"><span class="sl-title">Parameters</span><span class="sl-title" id="pCnt">0</span></div>
  <div class="sl-grid" id="slGrid"></div>
</div>
<div class="code-sec">
  <div class="code-hdr">
    <div class="code-hdr-left">
      <div class="tabs"><button class="tab active" data-tab="glsl">GLSL</button><button class="tab" data-tab="godot">Godot</button></div>
      <span class="edit-indicator" id="editBadge">✎ EDITING</span>
    </div>
    <div class="code-hdr-right">
      <button class="btn btn-sm" id="editBtn">✎ Edit</button>
      <button class="btn btn-sm btn-grn" id="compileBtn" style="display:none">▶ Recompile</button>
      <button class="btn btn-sm btn-warn" id="revertBtn" style="display:none">↩ Revert</button>
      <button class="btn btn-sm" id="copyCodeBtn">Copy Code</button>
    </div>
  </div>
  <div class="code-scroll" id="codeScroll"><div class="code-ct" id="codeEl"></div></div>
  <textarea class="code-edit" id="codeEdit" spellcheck="false"></textarea>
  <div class="compile-err" id="compileErr"></div>
</div>
<div class="fav-panel" id="favPanel">
  <div class="fav-title-bar"><span class="fav-title">⭐ Saved Shaders</span></div>
  <button class="btn fav-close" id="favClose">✕ Close</button>
  <div class="fav-grid" id="favGrid"></div>
</div>
<div class="toast" id="toast">Copied!</div>
<div class="shortcuts"><span>Space</span> Random <span>M</span> Mutate <span>F</span> Fullscreen <span>P</span> Pause <span>E</span> Edit <span>B</span> No BG <span>A</span> Auto <span>X</span> Fix Seam</div>

<!-- Screenshot modal -->
<div class="ss-backdrop" id="ssBg"></div>
<div class="ss-modal" id="ssModal">
  <h3>📷 Save Screenshot</h3>
  <div class="ss-opts">
    <button class="ss-opt" data-res="current">Current Size</button>
    <button class="ss-opt" data-res="1024">1024 × 1024</button>
    <button class="ss-opt" data-res="2048">2048 × 2048</button>
    <button class="ss-opt" data-res="4096">4096 × 4096</button>
  </div>
</div>

<!-- Auto mode panel -->
<div class="auto-panel" id="autoPanel">
  <h3>🔄 Auto Mode <span class="auto-status" id="autoStatus">Stopped</span></h3>
  <div class="auto-row">
    <label>New shader every</label>
    <input type="range" id="autoNewTime" min="2" max="30" step="1" value="8">
    <span class="auto-val" id="autoNewVal">8s</span>
  </div>
  <div class="auto-row">
    <label>Tweak params every</label>
    <input type="range" id="autoTweakTime" min="0" max="15" step="0.5" value="3">
    <span class="auto-val" id="autoTweakVal">3s</span>
  </div>
  <div class="auto-row">
    <label>Tweak amount</label>
    <input type="range" id="autoTweakAmt" min="0" max="1" step="0.05" value="0.25">
    <span class="auto-val" id="autoTweakAmtVal">25%</span>
  </div>
  <div class="auto-row">
    <label>Mode</label>
    <select id="autoMode">
      <option value="random">New random shader</option>
      <option value="mutate">Mutate from current</option>
      <option value="tweakOnly">Tweak params only (no new shaders)</option>
    </select>
  </div>
  <div class="auto-progress"><div class="auto-progress-bar" id="autoProgress"></div></div>
  <div class="auto-btns">
    <button class="btn btn-sm btn-a2" id="autoStartBtn" style="flex:1">▶ Start</button>
    <button class="btn btn-sm" id="autoStopBtn" style="flex:1;display:none">⏹ Stop</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// RNG
// ════════════════════════════════════════════════════════════
class R{constructor(s){this.s=s}n(){this.s=(this.s*16807)%2147483647;return(this.s-1)/2147483646}pick(a){return a[0|this.n()*a.length]}r(a,b){return a+this.n()*(b-a)}ir(a,b){return 0|this.r(a,b+1)}b(p=.5){return this.n()<p}f(a,b,d=2){return this.r(a,b).toFixed(d)}v3(a,b){return`vec3(${this.f(a,b)},${this.f(a,b)},${this.f(a,b)})`}}

// ════════════════════════════════════════════════════════════
// 2D SHADER GENERATOR (expanded)
// ════════════════════════════════════════════════════════════
function gen2D(rng,complexity,style){
const lc={simple:[1,2],medium:[2,4],complex:[3,6],chaos:[5,9],insane:[7,12]};
const[mn,mx]=lc[complexity]||lc.medium;
const nL=rng.ir(mn,mx);
const need=new Set();
const params=[];let pi=0;
const ap=(l,mn,mx,df,g,angular)=>{const name=`u_p${pi++}`;if(angular)df=Math.max(1,Math.round(df));params.push({name,label:l,min:mn,max:mx,def:df,group:g,angular:!!angular});return name;};

// ── UV PRE-TRANSFORM (expanded with IQ plane deformations) ──
let uvPre='';
const doUvTransform = rng.b(complexity==='simple'?.15:.5);
if(doUvTransform){
  const uvOps=['polar','mirror','tile','fisheye','twist','invert','repeat','kalMirror','logPolar','rippleUV','swirl','zoomPulse','barrel'];
  const uvOp=rng.pick(uvOps);
  switch(uvOp){
    case'polar':uvPre=`\n  uv=vec2(length(uv),abs(atan(uv.y,uv.x))/3.14159); // polar fold`;break;
    case'mirror':uvPre=rng.pick([`\n  uv=abs(uv); // mirror`,`\n  uv=vec2(abs(uv.x),uv.y); // mirror X`,`\n  uv=abs(uv)-${rng.f(.1,.3)}; // offset mirror`]);break;
    case'tile':{const s=ap('Tile',1,6,rng.r(2,4),'UV');uvPre=`\n  uv=fract(uv*${s})-.5; // tile`;break;}
    case'fisheye':{const s=ap('Fisheye',0,3,rng.r(.3,1.5),'UV');uvPre=`\n  uv*=1.+${s}*dot(uv,uv); // fisheye`;break;}
    case'twist':{need.add('rot');const s=ap('Twist',0,10,rng.r(1,5),'UV');uvPre=`\n  uv=rot(length(uv)*${s})*uv; // twist`;break;}
    case'invert':uvPre=`\n  uv=uv/(dot(uv,uv)+.1); // invert`;break;
    case'repeat':{const s=ap('Repeat',2,8,rng.r(2,5),'UV');uvPre=`\n  uv=mod(uv*${s}+.5,1.)-.5; // repeat`;break;}
    case'kalMirror':{need.add('angle');need.add('rot');const s=rng.ir(3,8);uvPre=`\n  {float a=angle(uv);float seg=6.2831/${s}.;a=mod(a,seg);a=min(a,seg-a);uv=vec2(cos(a),sin(a))*length(uv);} // kal mirror`;break;}
    case'logPolar':uvPre=`\n  uv=vec2(log(length(uv)+.001),abs(atan(uv.y,uv.x))); // log-polar fold`;break;
    case'rippleUV':{need.add('hash');need.add('noise');const a=ap('Ripple',0,.1,rng.r(.01,.05),'UV');const f=ap('RippleF',3,20,rng.r(5,12),'UV');uvPre=`\n  uv+=${a}*sin(${f}*length(uv)+u_time); // ripple`;break;}
    case'swirl':{need.add('rot');const tw=ap('Swirl',0,8,rng.r(1,4),'UV');uvPre=`\n  {float r=length(uv);float a=atan(uv.y,uv.x)+r*${tw};uv=vec2(cos(a),sin(a))*r;} // swirl`;break;}
    case'zoomPulse':{const a=ap('ZoomAmt',0,.3,rng.r(.05,.15),'UV');const s=ap('ZoomSpd',.5,4,rng.r(1,2.5),'UV');uvPre=`\n  uv*=1.+${a}*sin(u_time*${s}); // zoom pulse`;break;}
    case'barrel':{const d=ap('Barrel',0,.5,rng.r(.1,.3),'UV');uvPre=`\n  uv*=1.+${d}*dot(uv,uv); // barrel distortion`;break;}
  }
}

// ── OPERATIONS (massively expanded) ──
function genOp(li){
const pool=POOLS[style]||POOLS.any;
const op=rng.pick(pool);
const g=`L${li}`;
switch(op){

case'starfield':{need.add('hash');
const ly=rng.ir(2,4);const dn=ap('Density',5,40,rng.r(10,25),g);const tw=ap('Twinkle',.5,5,rng.r(1,3),g);
// Build as sum of layers in a single expression
let expr='0.';
for(let i=0;i<ly;i++){
  const offset=rng.f(10,200);
  expr=`(${expr})+smoothstep(.04,.0,length(fract(uv*(${dn}+${i*8}.))-.5))*hash(floor(uv*(${dn}+${i*8}.)))*step(.5,hash(floor(uv*(${dn}+${i*8}.)+${offset})))*(sin(u_time*${tw}*hash(floor(uv*(${dn}+${i*8}.)+17.))+hash(floor(uv*(${dn}+${i*8}.)))*80.)*.5+.5)`;
}
return{e:expr,c:`starfield(${ly})`};}

case'sierpinski':{

case'sdfBoolean':{need.add('sdfOps');need.add('smin');
const sc=ap('Scale',1,6,rng.r(1.5,3.5),g);const sp=ap('Speed',0,3,rng.r(.2,1),g);

return{e:`1.-smoothstep(0.,.02,${sdf})`,c:`sdf bool ${shapes}`};}

default:return{e:`sin(uv.x*10.+u_time)`,c:'wave'};}
}

// ── BUILD LAYERS ──
const layers=[];for(let i=0;i<nL;i++)layers.push(genOp(i));
let body=layers.map((l,i)=>`  float l${i}=${l.e}; // ${l.c}`).join('\n');

// ── POST-SHAPING (IQ shaping functions - 35% chance per layer) ──
const doShaping = complexity !== 'simple' && rng.b(.6);
if(doShaping){
  need.add('shaping');
  for(let i=0;i<nL;i++){
    if(rng.b(.35)){
      const shapeFn=rng.pick(['gain','parabola','cubicPulse','expImpulse']);
      if(shapeFn==='gain'){const k=ap('Gain',.5,5,rng.r(1,3),`L${i}`);body+=`\n  l${i}=gain(clamp(l${i},0.,1.),${k}); // shape:gain`;}
      else if(shapeFn==='parabola'){const k=ap('ParaK',.5,4,rng.r(1,2.5),`L${i}`);body+=`\n  l${i}=parabola(clamp(l${i},0.,1.),${k}); // shape:parabola`;}
      else if(shapeFn==='cubicPulse'){const c=ap('PulseC',0,1,rng.r(.3,.7),`L${i}`);const w=ap('PulseW',.05,.5,rng.r(.1,.3),`L${i}`);body+=`\n  l${i}=cubicPulse(${c},${w},clamp(l${i},0.,1.)); // shape:cubicPulse`;}
      else{const k=ap('Impulse',1,20,rng.r(3,10),`L${i}`);body+=`\n  l${i}=expImpulse(clamp(l${i},0.,1.),${k}); // shape:impulse`;}
    }
  }
}

// ── COLORING ──
need.add('pal');
const usePalette=rng.b(.65);

let colorCode;
if(usePalette){
  const palPool=STYLE_PALS[style]||PAL_PRESETS.map(p=>p.n);
  const palName=rng.pick(typeof palPool[0]==='string'?palPool:PAL_PRESETS.map(p=>p.n));
  const preset=PAL_PRESETS.find(p=>p.n===palName)||rng.pick(PAL_PRESETS);
  let pa=preset.a,pb=preset.b,pc=preset.c,pd=preset.d;
  if(rng.b(.4))pd=`${rng.f(0,1)},${rng.f(0,1)},${rng.f(0,1)}`;
  let palInput;
  if(nL===1)palInput='l0';
  else if(nL===2)palInput=`l0*${rng.f(.3,.8)}+l1*${rng.f(.2,.6)}`;
  else{palInput='l0';for(let i=1;i<Math.min(nL,4);i++)palInput+=`+l${i}*${rng.f(.15,.5)}`;}
  const palSpeed=rng.b(.6)?`+u_time*${rng.f(.02,.15)}`:'';
  colorCode=`\n  vec3 col=pal(${palInput}${palSpeed},vec3(${pa}),vec3(${pb}),vec3(${pc}),vec3(${pd})); // ${preset.n} palette`;
} else {
  const nC=Math.min(nL+1,rng.ir(2,4));
  const cols=[];
  if(rng.b(.35)){need.add('hsv');const bh=rng.r(0,1);for(let i=0;i<nC;i++){const h=(bh+i*rng.r(.08,.35))%1;cols.push(`hsv2rgb(vec3(${h.toFixed(3)},${rng.f(.5,1)},${rng.f(.35,1)}))`);}}
  else for(let i=0;i<nC;i++)cols.push(genCol(rng,style));
  let combo=`mix(${cols[0]},${cols[1%nC]},clamp(l0,0.,1.))`;
  // EXPANDED blend modes: added overlay, softlight, colordodge
  for(let i=1;i<nL;i++){const c=cols[(i+1)%nC];const cl=`clamp(l${i},0.,1.)`;const m=rng.pick(['mix','add','mul','screen','sub','overlay','softlight','colordodge']);
  if(m==='mix')combo=`mix(${combo},${c},${cl}*${rng.f(.3,.8)})`;
  else if(m==='add')combo=`(${combo})+${c}*${cl}*${rng.f(.15,.5)}`;
  else if(m==='mul')combo=`(${combo})*(1.-${cl}*${rng.f(.15,.5)})+${c}*${cl}*${rng.f(.15,.4)}`;
  else if(m==='screen')combo=`1.-(1.-(${combo}))*(1.-${c}*${cl}*${rng.f(.15,.5)})`;
  else if(m==='sub')combo=`max((${combo})-${c}*${cl}*${rng.f(.1,.35)},0.)`;
  else if(m==='overlay'){// overlay: 2*a*b if a<0.5, else 1-2*(1-a)*(1-b)
    combo=`mix(2.*(${combo})*${c}*${cl},1.-2.*(1.-(${combo}))*(1.-${c}*${cl}),step(.5,${combo}))*${rng.f(.4,.8)}+(${combo})*(1.-${rng.f(.4,.8)})`;}
  else if(m==='softlight'){combo=`mix(${combo},(1.-2.*${c}*${cl})*(${combo})*(${combo})+2.*${c}*${cl}*(${combo}),${rng.f(.2,.6)})`;}
  else if(m==='colordodge'){combo=`mix(${combo},(${combo})/(1.01-${c}*${cl}*${rng.f(.3,.7)}),${rng.f(.2,.5)})`;}}
  colorCode=`\n  vec3 col=${combo};`;
}
body+=colorCode;

// ── MOUSE ──
const mAmt=ap('Mouse',0,1,rng.r(.1,.5),'FX');
const mop=rng.pick(['glow','shift','bright','lens']);
if(mop==='glow')body+=`\n  col+=vec3(${mAmt})*pow(max(0.,1.-length(uv-u_mouse)*3.),2.);`;
else if(mop==='shift')body+=`\n  col=mix(col,col.gbr,${mAmt}*smoothstep(.3,0.,length(uv-u_mouse)));`;
else if(mop==='bright')body+=`\n  col*=1.+${mAmt}*smoothstep(.4,0.,length(uv-u_mouse))*.5;`;
else body+=`\n  col*=1.+${mAmt}*smoothstep(.2,0.,abs(length(uv-u_mouse)-.15))*2.;`;

// ── POST FX ──
let post='';const pg='FX';
if(rng.b(.5)){const g=ap('Gamma',.3,2.5,rng.r(.6,1.3),pg);post+=`\n  col=pow(max(col,0.),vec3(${g}));`;}
if(rng.b(.4)){const s=ap('Saturation',0,3,rng.r(.8,1.5),pg);post+=`\n  float lum=dot(col,vec3(.299,.587,.114));col=mix(vec3(lum),col,${s});`;}
if(rng.b(.35)){const b=ap('Brightness',0,3,rng.r(.8,1.3),pg);post+=`\n  col*=${b};`;}
if(rng.b(.3)){const v=ap('Vignette',0,3,rng.r(.3,1.2),pg);post+=`\n  col*=1.-length(uv)*${v};`;}
if(rng.b(.2)&&complexity!=='simple'){const i=ap('Scan',0,.6,rng.r(.05,.2),pg);post+=`\n  col*=1.-${i}*sin(gl_FragCoord.y*1.5)*.5;`;}
if(rng.b(.15)){const i=ap('ChromaShift',0,.04,rng.r(.003,.015),pg);post+=`\n  col.r*=1.+${i}*sin(uv.y*50.+u_time*2.);`;}
if(['glitch','lightning'].includes(style)&&rng.b(.5)){need.add('hash');const i=ap('Glitch',.9,1,rng.r(.95,.99),pg);post+=`\n  col=mix(col,col.grb,step(${i},hash(vec2(floor(u_time*12.),floor(uv.y*15.)))));`;}
if(['neon','holy','enchant','lightning','arcane','portal'].includes(style)&&rng.b(.5)){const g=ap('Glow',0,4,rng.r(.5,2.5),pg);post+=`\n  col+=max(col-.5,0.)*${g};`;}
if(['fire_spell','blood','void_magic','necro'].includes(style)&&rng.b(.4)){const h=ap('Haze',0,.05,rng.r(.005,.02),pg);post+=`\n  col=mix(col,col.brg,sin(uv.y*30.+u_time*3.)*${h});`;}
if(rng.b(.25)){const c=ap('Contrast',.5,2,rng.r(.8,1.3),pg);post+=`\n  col=(col-.5)*${c}+.5;`;}
if(rng.b(.15)){post+=`\n  col=col*col*(3.-2.*col); // smoothstep remap`;}
post+=`\n  col=clamp(col,0.,1.);`;

// ── ASSEMBLE GLSL ──
const hOrd=['hash','hash2','hash3','noise','gnoise','gfbm','fbm3','fbm','ridged','billow','curl','voronoi','voronoi2','smoothVoronoi','voronoise','rot','hsv','smin','fractalF','mandelbrot','burningShip','orbitTrap','sdHex','sdStar','sdSeg','sdTriangle','sdPentagon','sdMoon','sdVesica','sdfOps','angle','pal','shaping'];
let hCode='';for(const h of hOrd)if(need.has(h))hCode+=H[h]+'\n\n';
const uDecl=params.map(p=>`uniform float ${p.name};`).join('\n');
const glsl=`#ifdef GL_ES\nprecision mediump float;\n#endif\nuniform float u_time;\nuniform vec2 u_resolution;\nuniform vec2 u_mouse;\n${uDecl?uDecl+'\n':''}\n${hCode}void main(){\n  vec2 uv=(gl_FragCoord.xy-u_resolution*.5)/min(u_resolution.x,u_resolution.y);${uvPre}\n\n${body}\n${post}\n\n  gl_FragColor=vec4(col,1.);\n}`;

// ── GODOT ──
const shType=document.getElementById('shaderType').value;
const gdType=shType==='3d'?'spatial':'canvas_item';
let gH='';for(const h of hOrd)if(need.has(h))gH+=H[h].replace(/u_time/g,'TIME')+'\n\n';
const gU=params.map(p=>`uniform float ${p.name} : hint_range(${p.min}, ${p.max}) = ${p.def.toFixed(3)};`).join('\n');
const gdBody=(uvPre+'\n\n'+body).replace(/u_time/g,'TIME').replace(/u_mouse/g,'vec2(0)');
const gdPost=post.replace(/u_time/g,'TIME').replace(/gl_FragCoord\.y/g,'FRAGCOORD.y');
const gdUV='UV-.5';
let godot;
if(shType==='3d')godot=`shader_type spatial;\nrender_mode unshaded;\n\n${gU?gU+'\n\n':''}${gH}void fragment(){\n  vec2 uv=${gdUV};${gdBody}\n${gdPost}\n  ALBEDO=col;\n}`;
else godot=`shader_type canvas_item;\n\n${gU?gU+'\n\n':''}${gH}void fragment(){\n  vec2 uv=${gdUV};${gdBody}\n${gdPost}\n  COLOR=vec4(col,1.);\n}`;

return{glsl,godot,params,mode:'2d'};
}

function genCol(rng,style){
const P={
  any:()=>rng.v3(0,1),organic:()=>`vec3(${rng.f(.05,.35)},${rng.f(.25,.75)},${rng.f(.05,.45)})`,
  geometric:()=>rng.b()?`vec3(${rng.f(.1,.9)})`:`vec3(${rng.f(0,1)},${rng.f(0,1)},${rng.f(0,1)})`,
  neon:()=>{const c=[rng.f(0,.08),rng.f(0,.08),rng.f(0,.08)];c[rng.ir(0,2)]=rng.f(.8,1);c[rng.ir(0,2)]=rng.f(.4,.9);return`vec3(${c})`;},
  fire_spell:()=>rng.pick([`vec3(${rng.f(.8,1)},${rng.f(.15,.5)},${rng.f(0,.1)})`,`vec3(${rng.f(.9,1)},${rng.f(.5,.8)},${rng.f(0,.15)})`]),
  frost:()=>`vec3(${rng.f(.6,.9)},${rng.f(.8,1)},${rng.f(.9,1)})`,
  void_magic:()=>`vec3(${rng.f(.1,.3)},${rng.f(0,.15)},${rng.f(.2,.5)})`,
  holy:()=>`vec3(${rng.f(.9,1)},${rng.f(.85,1)},${rng.f(.6,.9)})`,
  poison:()=>`vec3(${rng.f(.1,.4)},${rng.f(.6,1)},${rng.f(0,.3)})`,
  arcane:()=>`vec3(${rng.f(.3,.7)},${rng.f(.1,.4)},${rng.f(.7,1)})`,
  blood:()=>`vec3(${rng.f(.5,.8)},${rng.f(0,.15)},${rng.f(0,.1)})`,
  necro:()=>`vec3(${rng.f(.2,.5)},${rng.f(.3,.6)},${rng.f(.1,.3)})`,
};return(P[style]||P.any)();}

// ════════════════════════════════════════════════════════════
// WEBGL + UI
// ════════════════════════════════════════════════════════════
const canvas=document.getElementById('glc');
const gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,alpha:true})||canvas.getContext('experimental-webgl',{preserveDrawingBuffer:true,alpha:true});
const errOvl=document.getElementById('errOvl'),errTxt=document.getElementById('errTxt');
const codeEl=document.getElementById('codeEl'),fpsEl=document.getElementById('fps');
const seedEl=document.getElementById('seedD'),toast=document.getElementById('toast');
const slGrid=document.getElementById('slGrid'),pCnt=document.getElementById('pCnt');
const mouseEl=document.getElementById('mousePos');
const codeEdit=document.getElementById('codeEdit');
const compileErr=document.getElementById('compileErr');

let prog=null,shaders={glsl:'',godot:''},tab='glsl',seed=0,pList=[];
let mouseX=0,mouseY=0,isPaused=false,timeSpeed=1,accTime=0,lastTime=0;
let history=[],favorites=[];
let isEditing=false,editedGlsl='',originalGlsl='';
let removeBG=false;

const vSrc=`attribute vec2 p;\nvoid main(){gl_Position=vec4(p,0.,1.);}`;
function mkS(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){const e=gl.getShaderInfoLog(sh);gl.deleteShader(sh);throw new Error(e);}return sh;}
function mkP(v,f){const vs=mkS(gl.VERTEX_SHADER,v),fs=mkS(gl.FRAGMENT_SHADER,f),p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){gl.deleteProgram(p);throw new Error(gl.getProgramInfoLog(p));}return p;}
const qB=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qB);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
function compile(src){errOvl.classList.remove('vis');compileErr.classList.remove('vis');
  // Inject alpha-from-luminance when removeBG is active
  let finalSrc=src;
  if(removeBG){
    finalSrc=finalSrc.replace(
      /gl_FragColor\s*=\s*vec4\s*\(\s*col\s*,\s*1\.\s*\)\s*;/,
      `float _bgAlpha=smoothstep(0.02,0.15,dot(col,vec3(.299,.587,.114)));gl_FragColor=vec4(col,_bgAlpha);`
    );
  }
  try{if(prog)gl.deleteProgram(prog);prog=mkP(vSrc,finalSrc);return true;}catch(e){
  if(isEditing){compileErr.textContent='⚠ '+e.message;compileErr.classList.add('vis');}
  else{errTxt.textContent=e.message;errOvl.classList.add('vis');}
  return false;}}

let fc=0,lt=performance.now();
function render(time){
  if(!lastTime)lastTime=time;const dt=(time-lastTime)*.001;lastTime=time;
  if(!isPaused)accTime+=dt*timeSpeed;
  const dpr=Math.min(devicePixelRatio,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height);
  if(removeBG){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);}
  else{gl.disable(gl.BLEND);}
  if(prog){gl.useProgram(prog);const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);gl.bindBuffer(gl.ARRAY_BUFFER,qB);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
  const tl=gl.getUniformLocation(prog,'u_time'),rl=gl.getUniformLocation(prog,'u_resolution'),ml=gl.getUniformLocation(prog,'u_mouse');
  if(tl)gl.uniform1f(tl,accTime);if(rl)gl.uniform2f(rl,canvas.width,canvas.height);if(ml)gl.uniform2f(ml,mouseX,mouseY);
  for(const p of pList){const loc=gl.getUniformLocation(prog,p.name);if(loc)gl.uniform1f(loc,p.value);}
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  fc++;const now=performance.now();if(now-lt>=500){fpsEl.textContent=`${Math.round(fc/((now-lt)/1000))} FPS`;fc=0;lt=now;}
  requestAnimationFrame(render);
}

const cWrap=document.getElementById('canvasWrap');
cWrap.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=((e.clientX-r.left)/r.width-.5)*2*(r.width/Math.min(r.width,r.height));mouseY=((.5-(e.clientY-r.top)/r.height))*2*(r.height/Math.min(r.width,r.height));mouseEl.textContent=`${mouseX.toFixed(2)}, ${mouseY.toFixed(2)}`;});

function buildSliders(){
  slGrid.innerHTML='';if(!pList.length){slGrid.innerHTML='<div class="sl-empty">No params</div>';pCnt.textContent='0';return;}
  pCnt.textContent=pList.length;
  for(const p of pList){const d=document.createElement('div');d.className='sl-item';
  const l=document.createElement('span');l.className='sl-label';l.innerHTML=`<span class="sl-tag">${p.group}</span>${p.label}${p.angular?' <span style="color:var(--acc5);font-size:7px">⟳</span>':''}`;
  const s=document.createElement('input');s.type='range';s.min=p.min;s.max=p.max;s.step=(p.max-p.min)/500;s.value=p.value;
  const v=document.createElement('span');v.className='sl-val';v.textContent=Number(p.value).toFixed(2);
  s.addEventListener('input',()=>{p.value=parseFloat(s.value);v.textContent=p.value.toFixed(2);});
  p._slider=s;p._valEl=v;d.append(l,s,v);slGrid.appendChild(d);}
}

function hl(code){let h=code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
h=h.replace(/(\/\/.*)/g,'<span class="cmt">$1</span>');
for(const k of['shader_type','canvas_item','spatial','render_mode','unshaded','precision','mediump','void','float','vec2','vec3','vec4','mat2','mat3','int','bool','uniform','varying','attribute','const','if','else','for','return','hint_range','break'])h=h.replace(new RegExp(`\\b(${k})\\b`,'g'),'<span class="kw">$1</span>');
for(const f of['sin','cos','tan','asin','acos','atan','pow','exp','log','log2','sqrt','abs','sign','floor','ceil','fract','mod','min','max','clamp','mix','step','smoothstep','length','distance','dot','cross','normalize','texture','reflect','exp2','fwidth'])h=h.replace(new RegExp(`\\b(${f})\\b`,'g'),'<span class="fn">$1</span>');
h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
for(const s of['gl_FragCoord','gl_FragColor','gl_Position','u_time','u_resolution','u_mouse','TIME','UV','COLOR','VERTEX','ALBEDO','FRAGCOORD','SCREEN_UV'])h=h.replace(new RegExp(`\\b(${s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`,'g'),'<span class="bi">$1</span>');
h=h.replace(/\b(u_p\d+)\b/g,'<span class="st">$1</span>');return h;}
function showCode(){
  const code=tab==='glsl'?shaders.glsl:shaders.godot;
  if(isEditing){
    codeEdit.value=tab==='glsl'?editedGlsl:shaders.godot;
    document.getElementById('codeScroll').style.display='none';
    codeEdit.classList.add('active');
  } else {
    codeEl.innerHTML=hl(code);
    document.getElementById('codeScroll').style.display='';
    codeEdit.classList.remove('active');
  }
}

function addHistory(seed,style,cx){const tc=document.createElement('canvas');tc.width=128;tc.height=96;tc.getContext('2d').drawImage(canvas,0,0,128,96);history.unshift({seed,style,cx,canvas:tc,params:pList.map(p=>({...p}))});if(history.length>20)history.pop();renderHistory();}
function renderHistory(){const hs=document.getElementById('histScroll'),hc=document.getElementById('histCount');hs.innerHTML='';hc.textContent=history.length;
history.forEach((h,i)=>{const d=document.createElement('div');d.className='hist-thumb'+(i===0?' active':'');const c=document.createElement('canvas');c.width=128;c.height=96;c.getContext('2d').drawImage(h.canvas,0,0);d.appendChild(c);
const lbl=document.createElement('div');lbl.className='ht-label';lbl.textContent=h.style;d.appendChild(lbl);
const star=document.createElement('div');star.className='fav-star'+(favorites.some(f=>f.seed===h.seed)?' saved':'');star.textContent='⭐';
star.addEventListener('click',e=>{e.stopPropagation();toggleFav(h);star.classList.toggle('saved');});d.appendChild(star);
d.addEventListener('click',()=>loadFromHistory(h));hs.appendChild(d);});}
function loadFromHistory(h){exitEditMode();seed=h.seed;document.getElementById('style').value=h.style;document.getElementById('complexity').value=h.cx;
const r=genShader(seed,h.cx,h.style);shaders=r;pList=r.params.map(p=>({...p,value:p.def}));seedEl.textContent=`Seed: ${seed}`;
if(compile(shaders.glsl)){buildSliders();showCode();updateURL();}renderHistory();}
function toggleFav(h){const idx=favorites.findIndex(f=>f.seed===h.seed);if(idx>=0)favorites.splice(idx,1);else{const tc=document.createElement('canvas');tc.width=200;tc.height=140;tc.getContext('2d').drawImage(h.canvas,0,0,200,140);favorites.push({...h,canvas:tc});}}
function renderFavs(){const fg=document.getElementById('favGrid');fg.innerHTML='';if(!favorites.length){fg.innerHTML='<div class="fav-empty">No saved shaders yet. Click ⭐ on history thumbnails.</div>';return;}
favorites.forEach(f=>{const card=document.createElement('div');card.className='fav-card';const c=document.createElement('canvas');c.width=200;c.height=140;c.getContext('2d').drawImage(f.canvas,0,0);card.appendChild(c);
const m=document.createElement('div');m.className='fav-meta';m.innerHTML=`<div class="fm-style">${f.style} / ${f.cx}</div><div class="fm-seed">Seed: ${f.seed}</div>`;card.appendChild(m);
card.addEventListener('click',()=>{document.getElementById('favPanel').classList.remove('vis');loadFromHistory(f);});fg.appendChild(card);});}

function showToast(msg){toast.textContent=msg;toast.classList.add('vis');setTimeout(()=>toast.classList.remove('vis'),1600);}
function resetParams(){for(const p of pList)p.value=p.def;buildSliders();}
function fixSeam(){let fixed=0;
  for(const p of pList){
    if(p.angular){
      const r=Math.round(p.value);
      if(r<1)p.value=1; else p.value=r;
      fixed++;
      if(p._slider)p._slider.value=p.value;
      if(p._valEl)p._valEl.textContent=p.value.toFixed(2);
    }
  }
  showToast(fixed?`Snapped ${fixed} angular param${fixed>1?'s':''} to integers`:'No angular params to fix — seam may be structural (polar/log UV)');}

// ════════════════════════════════════════════════════════════
// EDIT MODE (Phase 1.1)
// ════════════════════════════════════════════════════════════
const editBtn=document.getElementById('editBtn');
const compileBtn=document.getElementById('compileBtn');
const revertBtn=document.getElementById('revertBtn');
const editBadge=document.getElementById('editBadge');

function enterEditMode(){
  isEditing=true;
  editedGlsl=shaders.glsl;
  originalGlsl=shaders.glsl;
  codeEdit.value=editedGlsl;
  document.getElementById('codeScroll').style.display='none';
  codeEdit.classList.add('active');
  editBtn.style.display='none';
  compileBtn.style.display='';
  revertBtn.style.display='';
  editBadge.classList.add('vis');
  compileErr.classList.remove('vis');
  // Force GLSL tab when editing
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('[data-tab="glsl"]').classList.add('active');
  tab='glsl';
}
function exitEditMode(){
  isEditing=false;
  document.getElementById('codeScroll').style.display='';
  codeEdit.classList.remove('active');
  editBtn.style.display='';
  compileBtn.style.display='none';
  revertBtn.style.display='none';
  editBadge.classList.remove('vis');
  compileErr.classList.remove('vis');
  showCode();
}
function recompileEdited(){
  editedGlsl=codeEdit.value;
  if(compile(editedGlsl)){
    shaders.glsl=editedGlsl;
    showToast('Compiled!');
  }
}
function revertEdited(){
  shaders.glsl=originalGlsl;
  if(compile(originalGlsl)){
    exitEditMode();
    showCode();
    showToast('Reverted');
  }
}

editBtn.addEventListener('click',enterEditMode);
compileBtn.addEventListener('click',recompileEdited);
revertBtn.addEventListener('click',revertEdited);

// Tab key in textarea inserts spaces
codeEdit.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=codeEdit.selectionStart,end=codeEdit.selectionEnd;codeEdit.value=codeEdit.value.substring(0,s)+'  '+codeEdit.value.substring(end);codeEdit.selectionStart=codeEdit.selectionEnd=s+2;}
  // Ctrl/Cmd+Enter to recompile
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();recompileEdited();}
});

// ════════════════════════════════════════════════════════════
// SCREENSHOT (Phase 1.2)
// ════════════════════════════════════════════════════════════
const ssModal=document.getElementById('ssModal'),ssBg=document.getElementById('ssBg');
document.getElementById('ssBtn').addEventListener('click',()=>{ssModal.classList.add('vis');ssBg.classList.add('vis');});
ssBg.addEventListener('click',()=>{ssModal.classList.remove('vis');ssBg.classList.remove('vis');});

document.querySelectorAll('.ss-opt').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const res=btn.dataset.res;
    ssModal.classList.remove('vis');ssBg.classList.remove('vis');
    captureScreenshot(res);
  });
});

function captureScreenshot(res){
  const wasPaused=isPaused;isPaused=true;
  if(res==='current'){
    // Just capture current canvas
    doCapture();
  } else {
    // Render at specific resolution
    const size=parseInt(res);
    const oldW=canvas.width,oldH=canvas.height;
    canvas.width=size;canvas.height=size;
    gl.viewport(0,0,size,size);
    // Re-render one frame at target resolution
    if(prog){gl.useProgram(prog);
      const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);gl.bindBuffer(gl.ARRAY_BUFFER,qB);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
      const tl=gl.getUniformLocation(prog,'u_time'),rl=gl.getUniformLocation(prog,'u_resolution'),ml=gl.getUniformLocation(prog,'u_mouse');
      if(tl)gl.uniform1f(tl,accTime);if(rl)gl.uniform2f(rl,size,size);if(ml)gl.uniform2f(ml,0,0);
      for(const p of pList){const loc=gl.getUniformLocation(prog,p.name);if(loc)gl.uniform1f(loc,p.value);}
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    doCapture();
    // Restore
    canvas.width=oldW;canvas.height=oldH;
  }
  isPaused=wasPaused;
}
function doCapture(){
  const st=document.getElementById('style').value;
  const link=document.createElement('a');
  link.download=`shader-cauldron-${seed}-${st}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
  showToast('Screenshot saved!');
}

// ════════════════════════════════════════════════════════════
// SHAREABLE URL (Phase 1.3)
// ════════════════════════════════════════════════════════════
function updateURL(){
  try{const st=document.getElementById('style').value;
  const cx=document.getElementById('complexity').value;
  const hash=`#seed=${seed}&style=${st}&cx=${cx}`;
  window.history.replaceState(null,'',hash);}catch(e){}
}
function loadFromURL(){
  try{const h=window.location.hash;
  if(!h||h.length<2)return false;
  const params=new URLSearchParams(h.substring(1));
  const s=params.get('seed'),st=params.get('style'),cx=params.get('cx');
  if(s){
    seed=parseInt(s);
    if(st)document.getElementById('style').value=st;
    if(cx)document.getElementById('complexity').value=cx;
    const r=genShader(seed,cx||'medium',st||'any');
    shaders=r;pList=r.params.map(p=>({...p,value:p.def}));
    seedEl.textContent=`Seed: ${seed}`;
    for(const[k,v]of params){
      if(k.startsWith('p')){const idx=parseInt(k.substring(1));if(pList[idx])pList[idx].value=parseFloat(v);}}
    if(compile(shaders.glsl)){buildSliders();showCode();setTimeout(()=>addHistory(seed,st||'any',cx||'medium'),100);}
    return true;
  }}catch(e){}
  return false;
}

document.getElementById('shareBtn').addEventListener('click',()=>{
  const st=document.getElementById('style').value;
  const cx=document.getElementById('complexity').value;
  // Include param overrides
  let paramStr='';
  for(let i=0;i<pList.length;i++){
    if(Math.abs(pList[i].value-pList[i].def)>.001)paramStr+=`&p${i}=${pList[i].value.toFixed(3)}`;
  }
  const url=`${location.origin}${location.pathname}#seed=${seed}&style=${st}&cx=${cx}${paramStr}`;
  navigator.clipboard.writeText(url);
  showToast('URL copied!');
});

// Remove BG toggle
const bgBtn=document.getElementById('bgBtn');
bgBtn.addEventListener('click',()=>{
  removeBG=!removeBG;
  bgBtn.classList.toggle('btn-active',removeBG);
  bgBtn.textContent=removeBG?'🔲 BG Off':'🔲 No BG';
  cWrap.classList.toggle('transparent-bg',removeBG);
  // Recompile with/without alpha injection
  compile(isEditing?editedGlsl:shaders.glsl);
});

// ════════════════════════════════════════════════════════════
// AUTO MODE
// ════════════════════════════════════════════════════════════
let autoRunning=false,autoTimer=null,autoTweakTimer=null,autoStartTime=0;
const autoPanel=document.getElementById('autoPanel');
const autoStartBtn=document.getElementById('autoStartBtn');
const autoStopBtn=document.getElementById('autoStopBtn');
const autoStatusEl=document.getElementById('autoStatus');
const autoProgressBar=document.getElementById('autoProgress');
const autoNewTimeSlider=document.getElementById('autoNewTime');
const autoTweakTimeSlider=document.getElementById('autoTweakTime');
const autoTweakAmtSlider=document.getElementById('autoTweakAmt');
const autoModeSelect=document.getElementById('autoMode');

// Slider labels
autoNewTimeSlider.addEventListener('input',()=>{document.getElementById('autoNewVal').textContent=autoNewTimeSlider.value+'s';if(autoRunning)restartAutoTimers();});
autoTweakTimeSlider.addEventListener('input',()=>{document.getElementById('autoTweakVal').textContent=parseFloat(autoTweakTimeSlider.value)==0?'Off':autoTweakTimeSlider.value+'s';if(autoRunning)restartAutoTimers();});
autoTweakAmtSlider.addEventListener('input',()=>{document.getElementById('autoTweakAmtVal').textContent=Math.round(autoTweakAmtSlider.value*100)+'%';});

document.getElementById('autoBtn').addEventListener('click',()=>{autoPanel.classList.toggle('vis');});
// Close panel when clicking outside
document.addEventListener('click',e=>{if(!autoPanel.contains(e.target)&&e.target.id!=='autoBtn'&&autoPanel.classList.contains('vis'))autoPanel.classList.remove('vis');});

function tweakParams(){
  const amt=parseFloat(autoTweakAmtSlider.value);
  if(amt===0||!pList.length)return;
  for(const p of pList){
    if(p.group==='FX'&&Math.random()>.3)continue; // less likely to tweak FX
    const range=p.max-p.min;
    const delta=(Math.random()-.5)*2*range*amt;
    let newVal=p.value+delta;
    if(p.angular)newVal=Math.max(1,Math.round(newVal));
    newVal=Math.max(p.min,Math.min(p.max,newVal));
    p.value=newVal;
    if(p._slider)p._slider.value=newVal;
    if(p._valEl)p._valEl.textContent=newVal.toFixed(2);
  }
}

function autoNewShader(){
  const mode=autoModeSelect.value;
  if(mode==='tweakOnly'){
    tweakParams();
  } else if(mode==='mutate'){
    mutate();
  } else {
    randomize();
  }
  autoStartTime=performance.now();
}

function autoTweakTick(){
  tweakParams();
}

function restartAutoTimers(){
  clearInterval(autoTimer);clearInterval(autoTweakTimer);
  const newTime=parseFloat(autoNewTimeSlider.value)*1000;
  const tweakTime=parseFloat(autoTweakTimeSlider.value)*1000;
  const mode=autoModeSelect.value;
  if(mode!=='tweakOnly'){
    autoTimer=setInterval(autoNewShader,newTime);
  }
  if(tweakTime>0){
    autoTweakTimer=setInterval(autoTweakTick,tweakTime);
  }
  autoStartTime=performance.now();
}

function startAuto(){
  autoRunning=true;
  autoStartBtn.style.display='none';
  autoStopBtn.style.display='';
  autoStatusEl.textContent='Running';
  autoStatusEl.classList.add('running');
  document.getElementById('autoBtn').classList.add('btn-active');
  autoStartTime=performance.now();
  restartAutoTimers();
  // Start progress bar animation
  updateAutoProgress();
}

function stopAuto(){
  autoRunning=false;
  clearInterval(autoTimer);clearInterval(autoTweakTimer);
  autoTimer=null;autoTweakTimer=null;
  autoStartBtn.style.display='';
  autoStopBtn.style.display='none';
  autoStatusEl.textContent='Stopped';
  autoStatusEl.classList.remove('running');
  document.getElementById('autoBtn').classList.remove('btn-active');
  autoProgressBar.style.width='0%';
}

function updateAutoProgress(){
  if(!autoRunning)return;
  const mode=autoModeSelect.value;
  const interval=mode==='tweakOnly'?parseFloat(autoTweakTimeSlider.value)*1000:parseFloat(autoNewTimeSlider.value)*1000;
  const elapsed=performance.now()-autoStartTime;
  const pct=Math.min(100,(elapsed%interval)/interval*100);
  autoProgressBar.style.width=pct+'%';
  requestAnimationFrame(updateAutoProgress);
}

autoStartBtn.addEventListener('click',startAuto);
autoStopBtn.addEventListener('click',stopAuto);
autoModeSelect.addEventListener('change',()=>{if(autoRunning)restartAutoTimers();});

// ════════════════════════════════════════════════════════════
// MAIN ACTIONS
// ════════════════════════════════════════════════════════════
function randomize(){exitEditMode();const cx=document.getElementById('complexity').value,st=document.getElementById('style').value;
for(let a=0;a<12;a++){seed=0|Math.random()*2147483647;const r=genShader(seed,cx,st);shaders=r;pList=r.params.map(p=>({...p,value:p.def}));
seedEl.textContent=`Seed: ${seed}`;
if(compile(shaders.glsl)){buildSliders();showCode();updateURL();setTimeout(()=>addHistory(seed,st,cx),100);return;}}buildSliders();showCode();}
function mutate(){exitEditMode();const cx=document.getElementById('complexity').value,st=document.getElementById('style').value;
for(let a=0;a<12;a++){seed+=0|Math.random()*100+1;const r=genShader(seed,cx,st);shaders=r;pList=r.params.map(p=>({...p,value:p.def}));
seedEl.textContent=`Seed: ${seed}`;
if(compile(shaders.glsl)){buildSliders();showCode();updateURL();setTimeout(()=>addHistory(seed,st,cx),100);return;}}buildSliders();showCode();}

// Events
document.getElementById('randomBtn').addEventListener('click',randomize);
document.getElementById('tweakBtn').addEventListener('click',mutate);
document.getElementById('resetBtn').addEventListener('click',resetParams);
document.getElementById('fixSeamBtn').addEventListener('click',fixSeam);
document.getElementById('copyBtn').addEventListener('click',()=>{navigator.clipboard.writeText(tab==='glsl'?shaders.glsl:shaders.godot);showToast('Copied!');});
document.getElementById('copyCodeBtn').addEventListener('click',()=>{navigator.clipboard.writeText(isEditing?codeEdit.value:(tab==='glsl'?shaders.glsl:shaders.godot));showToast('Copied!');});
document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',()=>{
  if(isEditing&&t.dataset.tab!=='glsl'){showToast('Exit edit mode first');return;}
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');tab=t.dataset.tab;showCode();});});
document.getElementById('complexity').addEventListener('change',randomize);
document.getElementById('style').addEventListener('change',randomize);
document.getElementById('shaderType').addEventListener('change',showCode);
const pauseBtn=document.getElementById('pauseBtn');pauseBtn.addEventListener('click',()=>{isPaused=!isPaused;pauseBtn.textContent=isPaused?'▶':'⏸';});
const spdSlider=document.getElementById('spdSlider'),spdLabel=document.getElementById('spdLabel');spdSlider.addEventListener('input',()=>{timeSpeed=parseFloat(spdSlider.value);spdLabel.textContent=timeSpeed.toFixed(1)+'x';});
const fsBtn=document.getElementById('fsBtn'),fsExit=document.getElementById('fsExit');
function toggleFS(){cWrap.classList.toggle('fullscreen');fsExit.style.display=cWrap.classList.contains('fullscreen')?'block':'none';}
fsBtn.addEventListener('click',toggleFS);fsExit.addEventListener('click',toggleFS);
document.getElementById('favBtn').addEventListener('click',()=>{renderFavs();document.getElementById('favPanel').classList.add('vis');});
document.getElementById('favClose').addEventListener('click',()=>document.getElementById('favPanel').classList.remove('vis'));
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;
if(e.code==='Space'){e.preventDefault();randomize();}
if(e.code==='KeyM'){e.preventDefault();mutate();}
if(e.code==='KeyF'){e.preventDefault();toggleFS();}
if(e.code==='KeyP'){e.preventDefault();pauseBtn.click();}
if(e.code==='KeyR'){e.preventDefault();resetParams();}
if(e.code==='KeyX'){e.preventDefault();fixSeam();}
if(e.code==='KeyE'){e.preventDefault();if(isEditing)exitEditMode();else enterEditMode();}
if(e.code==='KeyB'){e.preventDefault();bgBtn.click();}
if(e.code==='KeyA'){e.preventDefault();if(autoRunning)stopAuto();else{autoPanel.classList.add('vis');startAuto();}}
if(e.code==='Escape'){if(isEditing){exitEditMode();}else if(cWrap.classList.contains('fullscreen'))toggleFS();if(document.getElementById('favPanel').classList.contains('vis'))document.getElementById('favPanel').classList.remove('vis');if(ssModal.classList.contains('vis')){ssModal.classList.remove('vis');ssBg.classList.remove('vis');}}});

// ── INIT ──
if(!loadFromURL()){randomize();}
requestAnimationFrame(render);
</script>
</body>
</html>
